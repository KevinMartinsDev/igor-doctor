[tasks."install"]
description = "Install the doctor's and the demo-leak project's Composer dependencies"
run = [
  "composer install --no-interaction --working-dir=.",
  "composer install --no-interaction --working-dir=examples/demo-leak",
]

[tasks."doctor"]
description = "Run igor:doctor with --allow-behaviour-change on a fresh copy of examples/demo-leak in var/demo-leak (the lab itself is never patched)"
depends = ["install"]
run = "bin/demo --allow-behaviour-change"

[tasks."doctor-symfony"]
description = "Run igor:doctor with --allow-behaviour-change on a fresh copy of the official Symfony demo in var/symfony-demo"
run = "bin/demo-symfony --allow-behaviour-change"
